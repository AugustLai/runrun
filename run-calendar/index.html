<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>跑步月曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--panel:#0d0d0d;--ink:#f5f5f5;--dim:#808080;--faint:#3a3a3a;--line:#1f1f1f;--orange:#ff5200;
  --num:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --tc:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--tc);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto;padding:0 10px 32px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px}
.nav{width:44px;height:44px;border-radius:50%;border:0;background:#141414;color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.nav:disabled{opacity:.25;cursor:default}
.nav:focus-visible{outline:2px solid var(--orange)}
.title{text-align:center}
.title b{display:block;font-size:24px;font-weight:700;letter-spacing:.02em}
.title span{font-family:var(--num);font-size:13px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}

/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 4px 16px}
.big{font-family:var(--num);font-weight:800;font-size:76px;line-height:.8;color:var(--orange);font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--ink);font-weight:700;margin-left:4px}
.stats{display:grid;gap:6px;text-align:right}
.stat{font-size:12px;color:var(--dim)}
.stat b{font-family:var(--num);font-size:19px;color:var(--ink);font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}

/* calendar */
.cal{touch-action:pan-y}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{padding:6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dow div{text-align:center;font-size:12px;color:var(--dim)}
.cell{min-height:94px;display:flex;flex-direction:column;align-items:center;padding:6px 1px 5px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit}
button.cell{cursor:pointer}
button.cell:active{background:#0e0e0e}
button.cell:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
.d{font-family:var(--num);font-weight:700;font-size:20px;line-height:1;color:var(--faint)}
.run .d{color:var(--ink)}
.today .d{color:var(--orange)}
.lunar{font-size:9.5px;color:#4d4d4d;margin-top:2px;white-space:nowrap}
.run .lunar{color:var(--dim)}
.lunar.m{color:var(--ink)}
.lunar.m::after{content:"";display:block;height:2px;background:var(--orange);margin-top:1px;border-radius:1px}
.rt{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:3px 3px 2px;min-height:0}
.rt img{max-width:86%;max-height:46px;object-fit:contain;filter:drop-shadow(0 0 .5px #ff5200) drop-shadow(0 0 .5px #ff5200)}
.k{font-family:var(--num);font-weight:700;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty-note{text-align:center;color:var(--dim);font-size:13px;padding:22px 0 4px}

/* list */
h2{font-size:14px;font-weight:500;color:var(--dim);margin:28px 4px 8px}
.list{list-style:none;margin:0;padding:0}
.list li button{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.list li button:active{background:#0e0e0e}
.list .thumb{width:44px;height:44px;display:grid;place-items:center;background:var(--panel);border-radius:10px}
.list .thumb img{max-width:34px;max-height:34px;filter:drop-shadow(0 0 .5px #ff5200)}
.list .when b{display:block;font-size:15px;font-weight:500}
.list .when span{font-size:12px;color:var(--dim)}
.list .km{font-family:var(--num);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.list .km small{font-size:13px;color:var(--dim);margin-left:2px}

/* months overview */
.months{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 6px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--faint);background:none;color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;text-align:left;cursor:pointer;min-width:86px}
.chip span{display:block;font-size:12px;color:var(--dim)}
.chip b{font-family:var(--num);font-size:20px;font-weight:700}
.chip.on{border-color:var(--orange)}
.chip.on b{color:var(--orange)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#111;border-radius:20px 20px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;max-width:520px;margin:0 auto}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none;visibility:visible;transition:transform .25s ease}
.grip{width:40px;height:4px;background:#333;border-radius:2px;margin:0 auto 14px}
.sheet .route{height:min(42vh,320px);display:grid;place-items:center}
.sheet .route img{max-width:80%;max-height:100%}
.sheet .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
.sheet .date b{display:block;font-size:20px}
.sheet .date span{font-size:13px;color:var(--dim)}
.sheet .km{font-family:var(--num);font-weight:800;font-size:56px;line-height:.85;color:var(--orange)}
.sheet .km small{font-size:20px;color:var(--ink);margin-left:3px}
.close{margin-top:18px;width:100%;height:46px;border-radius:12px;border:0;background:#1d1d1d;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{transition:none}}
@media (min-width:480px){.cell{min-height:112px}.rt img{max-height:62px}.d{font-size:24px}.k{font-size:15px}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="nav" id="prev" aria-label="上個月">‹</button>
    <div class="title"><b id="ttl"></b><span id="sub"></span></div>
    <button class="nav" id="next" aria-label="下個月">›</button>
  </div>
  <section class="hero">
    <div class="big" id="mkm"></div>
    <div class="stats">
      <div class="stat">跑步天數<b id="sdays"></b></div>
      <div class="stat">最長<b id="slong"></b></div>
    </div>
  </section>
  <div class="cal" id="cal">
    <div class="dow"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="grid" id="grid"></div>
    <div class="empty-note" id="emptyNote" hidden>這個月還沒有紀錄</div>
  </div>
  <h2 id="listTitle">本月紀錄</h2>
  <ul class="list" id="list"></ul>
  <h2>每月總覽 · 累計 <span id="allkm" style="color:var(--ink)"></span></h2>
  <div class="months" id="months"></div>
</div>
<div id="detail">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dDate">
    <div class="grip"></div>
    <div class="route" id="dRoute"></div>
    <div class="row">
      <div class="date"><b id="dDate"></b><span id="dLunar"></span></div>
      <div class="km" id="dKm"></div>
    </div>
    <button class="close" id="dClose">關閉</button>
  </div>
</div>

<script>
const RUNS = JSON.parse(document.getElementById("runs").textContent);
const START = {y:2026, m:8}; // 2026-09 (m is 0-based)
const DOW = ["日","一","二","三","四","五","六"];
const pad = n => String(n).padStart(2,"0");
const key = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const fmt = n => (Math.round(n*10)/10).toFixed(1);
const fmt2 = n => (Math.round(n*100)/100).toFixed(2);

// lunar via Intl Chinese calendar (blank if unsupported)
const LD = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
let lf=null; try{lf=new Intl.DateTimeFormat("zh-TW-u-ca-chinese",{month:"long",day:"numeric"})}catch(e){}
function lunar(y,m,d){
  if(!lf) return {t:"",first:false};
  try{
    const p=lf.formatToParts(new Date(y,m,d)); const day=+(p.find(x=>x.type==="day")||{}).value;
    const mon=(p.find(x=>x.type==="month")||{}).value||"";
    if(!day) return {t:"",first:false};
    return day===1?{t:mon,first:true}:{t:LD[day-1]||"",first:false};
  }catch(e){return {t:"",first:false}}
}

// month range: START → max(today, last run)
const now=new Date();
const keys=Object.keys(RUNS).sort();
const last=keys.length?keys[keys.length-1]:null;
let endY=now.getFullYear(), endM=now.getMonth();
if(last){const [ly,lm]=last.split("-").map(Number); if(ly*12+lm-1>endY*12+endM){endY=ly;endM=lm-1}}
const idx=(y,m)=>y*12+m, minI=idx(START.y,START.m), maxI=Math.max(minI,idx(endY,endM));
let cur = last ? (()=>{const [ly,lm]=last.split("-").map(Number);return idx(ly,lm-1)})() : maxI;
cur=Math.min(Math.max(cur,minI),maxI);

function monthRuns(i){const y=Math.floor(i/12),m=i%12,pre=`${y}-${pad(m+1)}-`;return keys.filter(k=>k.startsWith(pre)).map(k=>({k,d:+k.slice(8),...RUNS[k]}))}

function render(){
  const y=Math.floor(cur/12), m=cur%12, runs=monthRuns(cur);
  document.getElementById("ttl").textContent=`${y}年${m+1}月`;
  document.getElementById("sub").textContent=new Date(y,m,1).toLocaleString("en",{month:"long"});
  const tot=runs.reduce((s,r)=>s+(r.km||0),0);
  document.getElementById("mkm").innerHTML=`${fmt(tot)}<small>km</small>`;
  document.getElementById("sdays").textContent=`${runs.length} 天`;
  const longest=runs.reduce((s,r)=>Math.max(s,r.km||0),0);
  document.getElementById("slong").textContent=longest?`${fmt2(longest)} km`:"—";
  document.getElementById("prev").disabled=cur<=minI;
  document.getElementById("next").disabled=cur>=maxI;

  const g=document.getElementById("grid"); g.innerHTML="";
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++){const c=document.createElement("div");c.className="cell";g.appendChild(c)}
  const todayKey=key(now.getFullYear(),now.getMonth(),now.getDate());
  for(let d=1;d<=days;d++){
    const k=key(y,m,d), r=RUNS[k], L=lunar(y,m,d);
    const c=document.createElement(r?"button":"div");
    c.className="cell"+(r?" run":"")+(k===todayKey?" today":"");
    if(r){c.type="button";c.setAttribute("aria-label",`${m+1}月${d}日 ${r.km!=null?fmt2(r.km)+" 公里":""}`);c.onclick=()=>openDetail(k)}
    c.innerHTML=`<span class="d">${d}</span><span class="lunar${L.first?" m":""}">${L.t}</span>
      <span class="rt">${r&&r.route?`<img src="${r.route}" alt="">`:""}</span>
      <span class="k">${r&&r.km!=null?fmt2(r.km):""}</span>`;
    g.appendChild(c);
  }
  document.getElementById("emptyNote").hidden=runs.length>0;

  const list=document.getElementById("list"); list.innerHTML="";
  document.getElementById("listTitle").hidden=!runs.length;
  [...runs].reverse().forEach(r=>{
    const dt=new Date(y,m,r.d), L=lunar(y,m,r.d);
    const li=document.createElement("li");
    li.innerHTML=`<button type="button"><span class="thumb">${r.route?`<img src="${r.route}" alt="">`:""}</span>
      <span class="when"><b>${m+1}/${r.d}（${DOW[dt.getDay()]}）</b><span>農曆 ${L.t}</span></span>
      <span class="km">${r.km!=null?fmt2(r.km):"—"}<small>km</small></span></button>`;
    li.querySelector("button").onclick=()=>openDetail(r.k);
    list.appendChild(li);
  });

  const all=keys.reduce((s,k)=>s+(RUNS[k].km||0),0);
  document.getElementById("allkm").textContent=`${fmt(all)} km`;
  const ms=document.getElementById("months"); ms.innerHTML="";
  for(let i=maxI;i>=minI;i--){
    const t=monthRuns(i).reduce((s,r)=>s+(r.km||0),0);
    const b=document.createElement("button"); b.type="button"; b.className="chip"+(i===cur?" on":"");
    b.innerHTML=`<span>${Math.floor(i/12)}年${i%12+1}月</span><b>${fmt(t)}</b>`;
    b.onclick=()=>{cur=i;render();window.scrollTo({top:0,behavior:"smooth"})};
    ms.appendChild(b);
  }
}
function go(dir){const n=cur+dir;if(n<minI||n>maxI)return;cur=n;render()}
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);

// swipe
let sx=null,sy=null;
const cal=document.getElementById("cal");
cal.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
cal.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);sx=null},{passive:true});

// detail sheet
const det=document.getElementById("detail");
function openDetail(k){
  const r=RUNS[k],[y,mo,d]=k.split("-").map(Number),dt=new Date(y,mo-1,d),L=lunar(y,mo-1,d);
  document.getElementById("dRoute").innerHTML=r.route?`<img src="${r.route}" alt="${mo}月${d}日路線">`:"";
  document.getElementById("dDate").textContent=`${y}/${mo}/${d}（${DOW[dt.getDay()]}）`;
  document.getElementById("dLunar").textContent=L.t?`農曆 ${L.t}`:"";
  document.getElementById("dKm").innerHTML=r.km!=null?`${fmt2(r.km)}<small>km</small>`:"";
  det.classList.add("open"); document.getElementById("dClose").focus();
}
function closeDetail(){det.classList.remove("open")}
document.getElementById("scrim").onclick=closeDetail;
document.getElementById("dClose").onclick=closeDetail;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail();if(!det.classList.contains("open")){if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)}});
render();
</script>
</body>
</html>
